<div id="search-modal" class="search-modal" hidden>
  <div class="search-modal__backdrop" id="search-backdrop"></div>
  <div class="search-modal__box">
    <div class="search-modal__header">
      <span class="search-modal__title"><span style="color:var(--accent)">devtools/</span> search</span>
      <button class="search-modal__close" id="search-close" aria-label="Close search"><kbd>esc</kbd></button>
    </div>
    <div class="search-modal__input-wrap">
      <span class="search-input-slash">/</span>
      <input
        type="text"
        id="search-input"
        class="search-modal__input"
        placeholder="search tools, books, languages..."
        autocomplete="off"
        spellcheck="false"
      >
    </div>
    <div id="search-results" class="search-results" role="listbox"></div>
    <div class="search-modal__footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<script>
(function () {
  var index = null;
  var selected = -1;

  var modal    = document.getElementById('search-modal');
  var input    = document.getElementById('search-input');
  var results  = document.getElementById('search-results');
  var openBtn  = document.getElementById('search-open');
  var closeBtn = document.getElementById('search-close');
  var backdrop = document.getElementById('search-backdrop');

  function openSearch() {
    modal.removeAttribute('hidden');
    document.body.classList.add('search-open');
    input.focus();
    if (!index) loadIndex();
  }

  function closeSearch() {
    modal.setAttribute('hidden', '');
    document.body.classList.remove('search-open');
    input.value = '';
    results.innerHTML = '';
    selected = -1;
  }

  function loadIndex() {
    fetch('/index.json')
      .then(function(r) { return r.json(); })
      .then(function(data) { index = data; })
      .catch(function() { index = []; });
  }

  function typeLabel(section) {
    var map = {
      tools: 'tool', languages: 'lang', frameworks: 'fwk',
      books: 'book', courses: 'course', resources: 'res',
      stacks: 'stack', paths: 'path'
    };
    return map[section] || section;
  }

  function escape(str) {
    return str.replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function highlight(text, q) {
    if (!q) return escape(text);
    var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return escape(text).replace(re, '<mark>$1</mark>');
  }

  function search(q) {
    selected = -1;
    if (!q || q.length < 2) { results.innerHTML = ''; return; }
    if (!index) { results.innerHTML = ''; return; }

    var ql = q.toLowerCase();
    var scored = [];
    for (var i = 0; i < index.length; i++) {
      var item = index[i];
      var name = (item.name || '').toLowerCase();
      var desc = (item.description || '').toLowerCase();
      var score = 0;
      if (name === ql) score = 3;
      else if (name.startsWith(ql)) score = 2;
      else if (name.includes(ql)) score = 1;
      else if (desc.includes(ql)) score = 0;
      else continue;
      scored.push({ item: item, score: score });
    }
    scored.sort(function(a, b) { return b.score - a.score; });
    var top = scored.slice(0, 8);

    if (!top.length) {
      results.innerHTML = '<div class="search-empty">no results for <strong>' + escape(q) + '</strong></div>';
      return;
    }

    var html = '';
    for (var j = 0; j < top.length; j++) {
      var it = top[j].item;
      var desc_short = it.description ? it.description.slice(0, 80) : '';
      html += '<a href="' + escape(it.url) + '" class="search-result" role="option" tabindex="-1">'
        + '<span class="search-result__type">' + escape(typeLabel(it.type)) + '</span>'
        + '<span class="search-result__body">'
        + '<span class="search-result__name">' + highlight(it.name || it.slug, q) + '</span>'
        + (desc_short ? '<span class="search-result__desc">' + highlight(desc_short, q) + '</span>' : '')
        + '</span>'
        + '</a>';
    }
    results.innerHTML = html;
  }

  function getItems() { return results.querySelectorAll('.search-result'); }

  function setSelected(n) {
    var items = getItems();
    if (!items.length) return;
    if (selected >= 0 && selected < items.length) items[selected].classList.remove('is-selected');
    selected = Math.max(0, Math.min(n, items.length - 1));
    items[selected].classList.add('is-selected');
    items[selected].scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('input', function() { search(input.value.trim()); });

  input.addEventListener('keydown', function(e) {
    var items = getItems();
    if (e.key === 'ArrowDown')  { e.preventDefault(); setSelected(selected + 1); }
    if (e.key === 'ArrowUp')    { e.preventDefault(); setSelected(selected - 1); }
    if (e.key === 'Enter' && selected >= 0 && selected < items.length) {
      e.preventDefault(); items[selected].click();
    }
  });

  results.addEventListener('click', function(e) {
    var link = e.target.closest('.search-result');
    if (link) closeSearch();
  });

  window.devtoolsSearch = {
    open: openSearch,
    setQuery: function(q) {
      openSearch();
      input.value = q;
      search(q);
    }
  };

  openBtn.addEventListener('click', openSearch);
  closeBtn.addEventListener('click', closeSearch);
  backdrop.addEventListener('click', closeSearch);

  document.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      modal.hasAttribute('hidden') ? openSearch() : closeSearch();
    }
    if (e.key === 'Escape' && !modal.hasAttribute('hidden')) closeSearch();
  });
})();
</script>
